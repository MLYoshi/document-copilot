[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "greenlet==3.5.5",
    "httpx",
    "openai",
    "passlib[bcrypt]",
    "pgvector",
    "pydantic",
    "pydantic-ai",
    "pydantic-settings",
    "pyjwt",
    "sqlalchemy",
    "structlog",
    "uvicorn",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]
