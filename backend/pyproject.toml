[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "asyncpg",
    "bcrypt==5.0.0",
    "email-validator",
    "fastapi",
    "greenlet==3.5.5",
    "httpx",
    "openai",
    "pgvector",
    "pydantic",
    "pydantic-ai",
    "pydantic-settings",
    "pyjwt",
    "sqlalchemy",
    "structlog",
    "uvicorn",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.4",
]

[tool.ruff.lint]
# B008: Depends(...) 在参数默认值中是 FastAPI 的官方依赖注入写法
ignore = ["B008"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that need a real PostgreSQL or OpenAI credentials",
]
